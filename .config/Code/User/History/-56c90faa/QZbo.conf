################
### MONITORS ###
################

monitor=,preferred,auto,1

#################
### ECOSYSTEM ###
#################

# Popup after updating hyprland
# no_update_news=true


###################
### MY PROGRAMS ###
###################


# Set programs that you use
$terminal = kitty
$fileManager = nautilus
#$menu = "/home/kartik/.config/rofi/launchers/type-7/launcher.sh"
$menu = "/home/kartik/.scripts/toggle_menu.sh"
$powermenu = "/home/kartik/.config/rofi/powermenu/type-5/powermenu.sh"
$commandPalette = "/home/kartik/.scripts/general/command_palette.sh"


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = waybar
# exec-once = mako
exec-once = dunst &
exec-once = hypridle
exec-once = waypaper --restore
exec-once = kdeconnectd &
exec-once = /usr/lib/polkit-kde-authentication-agent-1

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Catppuccin Mocha Dark


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 6
    gaps_out = 12

    border_size = 3

    # Using Mauve and Blue for the active border gradient
    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 45deg
    # Using Surface0 for the inactive border
    col.inactive_border = rgba(313244ff)
    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 0.95
    inactive_opacity = 0.85

    shadow {
        enabled = true
        range = 6
        render_power = 3
        color = rgba(1e1e2eff)
    }

    blur {
        enabled = true
        size = 3
        passes = 2

        vibrancy = 0.13
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = slowEase,0.25,1,0.5,1
    bezier = fadeElegance,0.45,0.05,0.5,1
    bezier = floaty,0.15,0.85,0.35,1

    animation = global, 1, 7, slowEase
    animation = border, 1, 5, slowEase
    animation = windows, 1, 5.5, slowEase
    animation = windowsIn, 1, 4.5, slowEase, popin 85%
    animation = windowsOut, 1, 2, fadeElegance, popin 80%
    animation = fadeIn, 1, 2.1, fadeElegance
    animation = fadeOut, 1, 1.8, fadeElegance
    animation = fade, 1, 3.4, fadeElegance
    animation = layers, 1, 4.2, floaty
    animation = layersIn, 1, 3.9, floaty, fade
    animation = layersOut, 1, 2.3, fadeElegance, fade
    animation = fadeLayersIn, 1, 2.3, fadeElegance
    animation = fadeLayersOut, 1, 1.7, fadeElegance
    animation = workspaces, 1, 2.5, fadeElegance, fade
    animation = workspacesIn, 1, 1.6, fadeElegance, fade
    animation = workspacesOut, 1, 2.1, fadeElegance, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, B, exec, vivaldi
bind = ALT_L, B, exec, brave
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, F, exec, $fileManager
bind = , Print, exec, sh -c 'grim -g "$(slurp)" - | wl-copy -t image/png && notify-send "Screenshot Copied" "Selected area copied to clipboard."'
bind = SUPER, Print, exec, sh -c 'grim - | wl-copy -t image/png && notify-send "Screenshot Copied" "Full screen copied to clipboard."'
bind = ALT_L, Print, exec, sh -c 'grim - | wl-copy && notify-send "Screenshot Copied" "Full screen copied to clipboard."'
bind = SHIFT, Print, exec, sh -c 'grim -g "$(slurp)" ~/Pictures/Screenshots/$(date "+%Y-%m-%d_%H-%M-%S").png && notify-send "Screenshot Saved" "Selected area saved to ~/Pictures/Screenshots."'
bind = $mainMod, V, togglefloating,
bind = $mainMod, A, exec, rofi -show emoji -modi emoji -theme ~/.config/rofi/launchers/project/emoji.rasi
bindr = $mainMod, SUPER_L, exec, $menu
bind = $mainMod, X, exec, $powermenu
bind = $mainMod, C, exec, code
bind = $mainMod, T, exec, bijiben
# bind = $mainMod, W, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, C, exec, hyprpicker -a  # Color picker
#bind = $mainMod, P, exec, setsid kitty -- ~/.scripts/zsh/project_opener.sh &,  # Open a project in tmux
bind = $mainMod SHIFT, P, exec, $commandPalette  # Command Palette
bind = $mainMod, S, exec, sh -c "~/.scripts/hyprland/screen_recorder.sh",  # Record screen
bind = ALT_L, S, exec, spotify
# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, ALT_L, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Dunst rule for blur
# windowrulev2 = blur, class:^Dunst$
# windowrulev2 = opacity 0.90 override, class:^Dunst$

