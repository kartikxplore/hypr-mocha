$font = GeistMono Nerd Font
$font_time = Iosevka Nerd Font

background {
    monitor =
    path = /home/kartik/Pictures/Wallpapers/everbg5.jpg
    color = rgba(1e1e2eff)
    blur_passes = 4
}

# 🪵 Calm Welcome Text
label {
    text = Welcome back 
    color = rgba(cdd6f4ff)  # soft Everforest fg
    font_size = 20
    font_family = $font
    position = 0, 130
    halign = center
    valign = center
}

label {
    text = Kartik
    color = rgba(cba6f7ff)
    font_size = 40
    font_family = $font_time
    position = 0, 70
    halign = center
    valign = center
}

label {
    text = Lets Grind!
    color = rgba(f9e2afff)
    font_size = 13
    font_family = $font
    position = 0, 10
    halign = center
    valign = center
}

# 🕒 Time Display (clean white)
label {
    text = $TIME
    color = rgba(b4befeff)
    font_size = 80
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

# 📅 Date Display (slightly muted)
label {
    text = cmd[update:43200000] date +"%A, the %d of %B, %Y"
    color = rgba(a6adc8ff)  # Everforest greyish-brown
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

# 🔐 Input Field (Everforest-moss core)
input-field {
    size = 25%, 5%
    outline_thickness = 2

    inner_color = rgba(43, 51, 57, 0.95)     # Everforest hard background
    outer_color = rgba(142, 192, 124, 1.0)   # Moss green (success tone)
    check_color = rgba(120, 190, 110, 1.0)   # Softer green
    fail_color = rgba(202, 100, 80, 1.0)     # Soft warm red

    placeholder_text =    Enter to continue
    font_color = rgba(211, 198, 170, 1.0)
    font_family = Geist Mono Nerd Font
    fade_on_empty = false
    rounding = 15

    position = 0, -70
    halign = center
    valign = center
}
