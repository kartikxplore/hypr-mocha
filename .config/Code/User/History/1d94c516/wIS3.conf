$font = GeistMono Nerd Font
$font_time = Iosevka Nerd Font

background {
    monitor =
    path = /home/kartik/Pictures/Wallpapers/background.jpg
    color = rgba(1e1e2eff)
    blur_passes = 4
}

# 🪵 Calm Welcome Text
label {
    text = Welcome back 
    color = rgba(cdd6f4ff)  
    font_size = 20
    font_family = $font
    position = 0, 130
    halign = center
    valign = center
}

label {
    text = Kartik
    color = rgba(cba6f7ff)
    font_size = 40
    font_family = $font_time
    position = 0, 70
    halign = center
    valign = center
}

label {
    text = Lets Grind!
    color = rgba(f9e2afff)
    font_size = 13
    font_family = $font
    position = 0, 10
    halign = center
    valign = center
}

# 🕒 Time Display 
label {
    text = $TIME
    color = rgba(b4befeff)
    font_size = 80
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

# 📅 Date Display 
label {
    text = cmd[update:43200000] date +"%A, the %d of %B, %Y"
    color = rgba(a6adc8ff)  # Everforest greyish-brown
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

# 🔐 Input Field 
input-field {
    size = 25%, 5%
    outline_thickness = 2

    # Using Surface0 for the inner part
    inner_color = rgba(313244fa)
    # Using Lavender for the outline
    outer_color = rgba(b4befeff)
    # Using Green for success
    check_color = rgba(a6e3a1ff)
    # Using Red for failure
    fail_color = rgba(f38ba8ff)

    placeholder_text =    Enter to continue
    font_color = rgba(211, 198, 170, 1.0)
    font_family = Geist Mono Nerd Font
    fade_on_empty = false
    rounding = 15

    position = 0, -70
    halign = center
    valign = center
}
