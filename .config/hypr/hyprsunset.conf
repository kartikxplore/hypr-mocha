# Corrected hyprsunset.conf using the new profile format

# A profile for daytime (starts at 7:00 AM)
profile {
    time = 8:00
    # `identity = true` resets the screen to its default state (6500K, no gamma change)
    identity = true
}

# A profile for nighttime (starts at 7:00 PM or 19:00)
profile {
    time = 19:00
    # Sets a warmer temperature
    temperature = 4500
    # A slight gamma adjustment can make the screen easier on the eyes
    gamma = 0.9
}
