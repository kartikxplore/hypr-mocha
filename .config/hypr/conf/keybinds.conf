###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# --- Applications ---
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, B, exec, vivaldi
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, C, exec, code
bind = $mainMod, O, exec, obsidian
bind = ALT_L, S, exec, spotify
bind = ALT_L, G, exec, gtk-launch vivaldi-gdfaincndogidkdcdkhapmbffkckdkhn-Default.desktop
bind = ALT_L, T, exec, flatpak run org.gnome.TextEditor
bind = ALT_L, B, exec, brave

# --- Rofi Menus ---
bindr = $mainMod, SUPER_L, exec, $menu # App Launcher
bind = $mainMod, X, exec, $powermenu # Power Menu
bind = $mainMod, A, exec, rofi -show emoji -modi emoji -theme ~/.config/rofi/launchers/project/emoji.rasi
bind = $mainMod SHIFT, P, exec, $commandPalette # Command Palette

# --- System & Session ---
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit, 
bind = $mainMod SHIFT, R, exec, hyprctl reload # Reload Hyprland config

# --- Utilities ---
bind = $mainMod SHIFT, C, exec, hyprpicker -a # Color Picker (Changed from $mainMod+C)
bind = $mainMod SHIFT, H, exec, ~/.config/waybar/scripts/toggle-hyprsunset.sh # Toggle Hyprsunset
bind = , Print, exec, ~/.scripts/screenshot.sh # Screenshot utility
# Shift + Print: Take a full-screen screenshot and COPY to clipboard.
bind = SHIFT, Print, exec, sh -c 'grim - | wl-copy -t image/png && notify-send "Screenshot Copied" "Full screen copied to clipboard."'

# Ctrl + Print: Select an area and COPY the screenshot to clipboard.
bind = CONTROL, Print, exec, sh -c 'grim -g "$(slurp)" - | wl-copy -t image/png && notify-send "Screenshot Copied" "Selected area copied to clipboard."'

# --- Window Management ---
bind = $mainMod, V, togglefloating,
bind = ALT_L, RETURN, fullscreen 
bind = $mainMod, J, togglesplit, # Dwindle layout: change split orientation
bind = $mainMod, P, pseudo, # Dwindle layout: toggle pseudo-tiling

# --- Layout Control ---
bind = $mainMod, L, layoutmsg, cyclenext # Cycle through available layouts (dwindle, master)

# --- Focus Control ---
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l # Vim-style focus
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# --- Workspace Control ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Keyboard-based workspace scrolling
bind = $mainMod, Page_Down, workspace, e+1
bind = $mainMod, Page_Up, workspace, e-1

# --- Scratchpad / Special Workspace ---
bind = $mainMod, S, togglespecialworkspace, magic 
bind = $mainMod SHIFT, O, movetoworkspace, special:magic # Move window to scratchpad (Changed from Shift+S)

# --- Move & Resize Windows (Submap) ---
# This creates a "mode" for moving and resizing. Press $mainMod+R to enter.
# While in the mode, use arrow keys to move/resize. Press ESC to exit.
bind = $mainMod, R, submap, resize
submap = resize
binde=, left, resizeactive,-20 0
binde=, right, resizeactive,20 0
binde=, up, resizeactive,0 -20
binde=, down, resizeactive,0 20
bind=, escape, submap, reset 
submap = reset

# Fallback move/resize (if you don't like submaps)
# Move active window
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# --- Laptop multimedia keys (Your original binds are great, no change needed) ---
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous